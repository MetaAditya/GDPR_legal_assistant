<!doctype html>
<html>
  <head>
    <title>Chat Streaming UI</title>

    <link
      rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', path='images/favicon.ico') }}"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Your custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css" />

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body>
    <div class="top-bar">
      <!-- <a href="/download" class="download-btn"> Download Summary </a> -->
      <a href="/graph" class="graph-link" title="Visualize graph data">
        <img
          src="{{ url_for('static', path='images/GDPR_logo.jpg') }}"
          alt="GDPR Legal Assistant"
          class="chat-logo"
        />
      </a>
      <div class="app-name">GDPR LEGAL ASSISTANT</div>
      <div class="chat-mode-toggle">
        <span id="chat-mode-label">Legal Chat</span>

        <label class="switch">
          <input
            type="checkbox"
            id="chat-mode-switch"
            onchange="toggleChatMode()"
          />
          <span class="slider"></span>
        </label>
      </div>

      <!-- User menu -->
      <div class="user-menu">
        <div class="avatar-container">
          <button class="user-avatar" type="button">
            {{ user.username[0] | upper }}
          </button>

          <div class="user-dropdown" id="user-dropdown">
            <div class="user-dropdown-name">{{ user.username }}</div>

            <div class="dropdown-divider"></div>

            <a href="/logout" class="logout-link"> Logout </a>
          </div>
        </div>
      </div>
    </div>

    <!-- ========================= -->

    <div class="container-fluid min-vh-100 d-flex justify-content-center">
      <div class="chat-container">
        <!-- Chat -->
        <div id="chat-box"></div>

        <!-- Input -->
        <div id="input-container" class="d-flex gap-2 align-items-center">
          <input
            type="text"
            id="prompt"
            class="form-control"
            placeholder="Ask a legal question..."
            onkeydown="handleKeyPress(event)"
          />

          <button
            type="button"
            class="attach-btn"
            onclick="document.getElementById('file-input').click()"
            title="Attach document"
          >
            <img
              src="{{ url_for('static', path='images/attach.png') }}"
              alt="Attach file"
            />
          </button>

          <input
            type="file"
            id="file-input"
            hidden
            onchange="handleFileUpload(event)"
          />

          <button class="btn btn-primary px-4" onclick="sendMessage()">
            Send
          </button>
        </div>
      </div>
    </div>

    <script>
      function scrollChatToBottom() {
        const chatBox = document.getElementById("chat-box");
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    </script>

    <script>
      function handleKeyPress(event) {
        if (event.key === "Enter") {
          event.preventDefault();
          sendMessage();
        }
      }
      const toolMessages = {
        data_retriever: "Searching legal knowledge base…",
        general_legal_researcher: "Researching legal information…",
        gpdr_web_search: "Checking current GDPR sources…",
        compliance_verifier: "Verifying compliance requirements…",
        user_compliance_verifier: "Verifying user compliance requirements…",
        risk_analyzer: "Analyzing risk components…",
        retrieve_top_chunks: "Examining user draft...",
        download_tool: "Preparing the PDF...",
      };

      async function sendMessage() {
        const promptInput = document.getElementById("prompt");
        const prompt = promptInput.value;

        if (!prompt) {
          return;
        }

        // Clear input immediately
        promptInput.value = "";
        const chatBox = document.getElementById("chat-box");

        // User message

        chatBox.innerHTML += `
    <div class="user">
        <img
            src="/static/images/user.png"
            class="message-avatar"
            alt="User"
        >
        <span>${prompt}</span>
    </div>
`;
        // Immediately scroll to user's message
        scrollChatToBottom();
        // --------------------------------
        // Assistant message container
        // --------------------------------

        const assistantDiv = document.createElement("div");
        assistantDiv.className = "assistant";

        // Bot image
        const botImage = document.createElement("img");

        botImage.src = "/static/images/bot.png";
        botImage.alt = "Assistant";
        botImage.className = "message-avatar";

        // Content container
        const assistantContent = document.createElement("div");

        assistantContent.className = "assistant-content";
        // Tool status
        const toolStatus = document.createElement("div");
        toolStatus.className = "tool-status";
        toolStatus.style.display = "none";

        assistantContent.appendChild(toolStatus);
        // -------------------------
        // Loader
        // -------------------------

        const loader = document.createElement("div");
        loader.className = "thinking-loader";

        loader.innerHTML = `
   <span>Thinking</span>
   
    
`;
        // Put loader inside content
        assistantContent.appendChild(loader);

        // Add both to assistant container
        assistantDiv.appendChild(botImage);
        assistantDiv.appendChild(assistantContent);

        // Add assistant message to chat
        chatBox.appendChild(assistantDiv);

        let assistantResponse = "";

        const eventSource = new EventSource(
          `/frontend-stream?prompt=${encodeURIComponent(prompt)}&chat_mode=${encodeURIComponent(chatMode)}`,
        );

        eventSource.onmessage = function (event) {
          try {
            const data = JSON.parse(event.data);

            // =====================================
            // NORMAL AI RESPONSE
            // =====================================

            if (data.type === "token") {
              // Remove thinking indicator
              if (loader) {
                loader.remove();
              }

              // Hide tool status
              toolStatus.style.display = "none";

              assistantResponse += data.content;

              assistantContent.innerHTML = marked.parse(assistantResponse);
            }

            // =====================================
            // TOOL START
            // =====================================
            else if (data.type === "tool_start") {
              console.log("Tool started:", data.tool);

              const message =
                toolMessages[data.tool] || "Working on your request…";

              // Remove thinking loader
              if (loader) {
                loader.remove();
              }

              // Show tool status
              toolStatus.textContent = message;

              toolStatus.style.display = "block";
            }

            // =====================================
            // TOOL END
            // =====================================
            else if (data.type === "tool_end") {
              console.log("Tool finished:", data.tool);

              toolStatus.style.display = "none";
            }

            // =====================================
            // GUARDRAIL
            // =====================================
            else if (data.type === "guardrail") {
              console.log("Guardrail:", data.content);

              // Remove loader
              if (loader) {
                loader.remove();
              }

              // Hide tool status
              toolStatus.style.display = "none";

              assistantResponse = data.content;

              assistantContent.innerHTML = marked.parse(assistantResponse);

              eventSource.close();
            }

            // Scroll
            chatBox.scrollTop = chatBox.scrollHeight;
          } catch (error) {
            console.error("Error processing SSE:", error);
          }
        };

        eventSource.onerror = function () {
          console.log("Streaming finished.");

          eventSource.close();
        };
      }
    </script>

    <script>
      function showUploadToast(message, title = "Document") {
        const toastElement = document.getElementById("upload-toast");

        document.getElementById("toast-title").innerText = title;
        document.getElementById("toast-message").innerText = message;

        const toast = new bootstrap.Toast(toastElement, {
          delay: 3000,
          autohide: true,
        });

        toast.show();
      }

      async function handleFileUpload(event) {
        const file = event.target.files[0];

        if (!file) {
          return;
        }

        showUploadToast(`Ingesting ${file.name}...`, "Document Upload");

        const formData = new FormData();

        formData.append("file", file);

        try {
          const response = await fetch("/upload", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            throw new Error("Upload failed");
          }

          const result = await response.json();

          console.log("Upload response:", result);

          showUploadToast(`${file.name} ingestion complete.`, "Success ✓");
        } catch (error) {
          console.error(error);

          showUploadToast(`Failed to ingest ${file.name}.`, "Error");
        }
      }
    </script>

    <script>
      let timer;

      function resetTimer() {
        clearTimeout(timer);

        timer = setTimeout(
          () => {
            window.location.href = "/logout";
          },
          30 * 60 * 1000,
        );
      }

      ["mousemove", "keydown", "click", "scroll"].forEach((event) => {
        document.addEventListener(event, resetTimer);
      });

      resetTimer();
    </script>
    <script>
      let chatMode = "legal";

      function toggleChatMode() {
        const toggle = document.getElementById("chat-mode-switch");
        const label = document.getElementById("chat-mode-label");

        if (toggle.checked) {
          chatMode = "document";
          label.innerText = "Document Chat";
        } else {
          chatMode = "legal";
          label.innerText = "Legal Chat";
        }

        console.log("Chat mode:", chatMode);
      }
      function toggleUserDropdown() {
        const dropdown = document.getElementById("user-dropdown");

        dropdown.classList.toggle("show");
      }
    </script>
    <!-- Upload Toast -->
    <div
      class="toast-container position-fixed bottom-0 end-0 p-3"
      style="z-index: 1100"
    >
      <div
        id="upload-toast"
        class="toast"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="toast-header">
          <strong class="me-auto" id="toast-title"> Document </strong>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>

        <div class="toast-body" id="toast-message"></div>
      </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        console.log("Dropdown script loaded");

        const avatarContainer = document.querySelector(".avatar-container");

        const dropdown = document.getElementById("user-dropdown");

        console.log("Avatar container:", avatarContainer);
        console.log("Dropdown:", dropdown);

        if (!avatarContainer || !dropdown) {
          console.error("Dropdown elements NOT FOUND");
          return;
        }
      });
    </script>
  </body>
</html>
